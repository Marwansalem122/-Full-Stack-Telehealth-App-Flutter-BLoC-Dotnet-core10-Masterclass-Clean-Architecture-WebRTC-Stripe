

<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.85; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>

<style>
  #erd svg.erDiagram text,
  #erd svg.erDiagram .label,
  #erd svg.erDiagram .entityLabel,
  #erd svg.erDiagram .relationshipLabel {
    fill: #111111 !important;
    color: #111111 !important;
    font-weight: 500 !important;
  }
  #erd svg.erDiagram .entityLabel {
    font-weight: 700 !important;
  }
  #erd svg.erDiagram .relationshipLabel {
    font-weight: 600 !important;
  }
  #erd svg.erDiagram .divider path {
    stroke: #222222 !important;
    stroke-opacity: 0.9 !important;
  }
  #erd svg.erDiagram .relationshipLine {
    stroke: #222222 !important;
    stroke-width: 2px !important;
  }
  @media (prefers-color-scheme: dark) {
    #erd svg.erDiagram text,
    #erd svg.erDiagram .label,
    #erd svg.erDiagram .entityLabel,
    #erd svg.erDiagram .relationshipLabel {
      fill: #f5f5f5 !important;
      color: #111111 !important;
    }
    #erd svg.erDiagram .divider path,
    #erd svg.erDiagram .relationshipLine {
      stroke: #111111 !important;
    }
  }
</style>

<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '15px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? "#111111" : "#222222",
    textColor: dark ? "#f5f5f5" : "#111111",
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  USERS ||--o| CONSULTANT_PROFILES : "has (if consultant)"
  USERS ||--o| PATIENT_PROFILES : "has (if patient)"
  CONSULTANT_PROFILES ||--o{ AVAILABILITY_SLOTS : defines
  CONSULTANT_PROFILES ||--o{ APPOINTMENTS : accepts
  PATIENT_PROFILES ||--o{ APPOINTMENTS : books
  APPOINTMENTS ||--o| CONSULTATIONS : produces

  USERS {
    guid Id PK
    string Email
    string PasswordHash
    string Role
    datetime CreatedAt
  }
  CONSULTANT_PROFILES {
    guid Id PK
    guid UserId FK
    string Specialty
    string Bio
    string TimeZoneId
    bool IsVerified
    string ProfileImageUrl
  }
  PATIENT_PROFILES {
    guid Id PK
    guid UserId FK
    string HealthInfo
    string ContactDetails
  }
  AVAILABILITY_SLOTS {
    guid Id PK
    guid ConsultantId FK
    int DayOfWeek
    time StartTimeUtc
    time EndTimeUtc
  }
  APPOINTMENTS {
    guid Id PK
    guid PatientId FK
    guid ConsultantId FK
    datetime ScheduledStartUtc
    string Status
    string CancellationReason
    datetime CancelledAt
  }
  CONSULTATIONS {
    guid Id PK
    guid AppointmentId FK
    datetime StartedAt
    datetime EndedAt
    int DurationMinutes
    string Status
  }`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
