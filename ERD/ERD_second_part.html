<style>
  #erd {
    width: 100%;
    overflow-x: auto;
    padding: 24px;
    box-sizing: border-box;
  }

  #erd svg.erDiagram {
    width: 100%;
    min-width: 1100px;
    height: auto;
    overflow: visible;
  }

  /* Force ALL Mermaid text to black */
  #erd svg.erDiagram text,
  #erd svg.erDiagram tspan,
  #erd svg.erDiagram .label,
  #erd svg.erDiagram .entityLabel,
  #erd svg.erDiagram .relationshipLabel {
    font-family: Arial, Helvetica, sans-serif !important;
    fill: #111111 !important;
    color: #111111 !important;
  }

  /* Entity names */
  #erd svg.erDiagram .entityLabel {
    font-size: 18px !important;
    font-weight: 700 !important;
  }

  /* Relationship labels */
  #erd svg.erDiagram .relationshipLabel {
    font-size: 14px !important;
    font-weight: 600 !important;
  }

  /* Lines */
  #erd svg.erDiagram .divider path,
  #erd svg.erDiagram .relationshipLine {
    stroke: #222222 !important;
    stroke-opacity: 1 !important;
    stroke-width: 2px !important;
  }

  /* Entity borders */
  #erd svg.erDiagram .node rect,
  #erd svg.erDiagram .node path {
    stroke: #222222 !important;
    stroke-width: 1.5px !important;
  }

  /* Row borders */
  #erd svg.erDiagram .row-rect-odd path,
  #erd svg.erDiagram .row-rect-even path {
    stroke: #d0d0d0 !important;
    stroke-width: 1px !important;
  }

  /* IMPORTANT:
   Do not change text color when browser is in dark mode.
*/
  @media (prefers-color-scheme: dark) {
    #erd svg.erDiagram text,
    #erd svg.erDiagram tspan,
    #erd svg.erDiagram .label,
    #erd svg.erDiagram .entityLabel,
    #erd svg.erDiagram .relationshipLabel {
      fill: #111111 !important;
      color: #111111 !important;
    }

    #erd svg.erDiagram .divider path,
    #erd svg.erDiagram .relationshipLine,
    #erd svg.erDiagram .node rect,
    #erd svg.erDiagram .node path {
      stroke: #222222 !important;
    }
  }

  /* Keep row separators invisible, as in the adjusted version */
  #erd svg.erDiagram .row-rect-odd path,
  #erd svg.erDiagram .row-rect-odd rect,
  #erd svg.erDiagram .row-rect-even path,
  #erd svg.erDiagram .row-rect-even rect {
    stroke: none !important;
  }
</style>
<div id="erd"></div>
<script type="module">
  import mermaid from "https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs";
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  await document.fonts.ready;
  mermaid.initialize({
    startOnLoad: false,
    theme: "base",
    fontFamily: '"anthropic-sans", sans-serif',
    themeVariables: {
      darkMode: dark,
      fontSize: "13px",
      fontFamily: '"anthropic-sans", sans-serif',
      lineColor: dark ? "#9c9a92" : "#73726c",
      textColor: dark ? "#c2c0b6" : "#3d3d3a",
    },
  });
  const { svg } = await mermaid.render(
    "erd-svg",
    `erDiagram
  APPOINTMENTS ||--o| PAYMENTS : "paid via"
  APPOINTMENTS ||--o{ CHAT_MESSAGES : contains
  USERS ||--o{ CHAT_MESSAGES : sends
  CONSULTATIONS ||--o| AI_SUMMARIES : generates
  CONSULTATIONS ||--o| AI_JOBS : "processed by"
  USERS ||--o{ NOTIFICATIONS : receives
  USERS ||--o{ REFRESH_TOKENS : has

  PAYMENTS {
    guid Id PK
    guid AppointmentId FK
    decimal Amount
    string Currency
    string StripePaymentIntentId
    string StripeClientSecret
    string IdempotencyKey
    string Status
    datetime CreatedAt
    datetime PaidAt
  }
  CHAT_MESSAGES {
    guid Id PK
    guid AppointmentId FK
    guid SenderId FK
    string Content
    string MessageType
    datetime SentAt
    datetime ReadAt
  }
  AI_SUMMARIES {
    guid Id PK
    guid ConsultationId FK
    string ChiefComplaint
    json StructuredOutput
    datetime CreatedAt
  }
  AI_JOBS {
    guid Id PK
    guid ConsultationId FK
    string Status
    datetime ProcessingStartedAt
    int RetryCount
    string Provider
    string PromptVersion
    string ErrorDetails
    datetime CreatedAt
  }
  NOTIFICATIONS {
    guid Id PK
    guid UserId FK
    string Type
    json Data
    bool IsRead
    datetime ReadAt
    datetime CreatedAt
  }
  REFRESH_TOKENS {
    guid Id PK
    guid UserId FK
    string TokenHash
    datetime ExpiresAt
    datetime CreatedAt
    datetime RevokedAt
  }`,
  );
  document.getElementById("erd").innerHTML = svg;

  document.querySelectorAll("#erd svg.erDiagram .node").forEach((node) => {
    const firstPath = node.querySelector("path[d]");
    if (!firstPath) return;
    const d = firstPath.getAttribute("d");
    const nums = d.match(/-?[\d.]+/g)?.map(Number);
    if (!nums || nums.length < 8) return;
    const xs = [nums[0], nums[2], nums[4], nums[6]];
    const ys = [nums[1], nums[3], nums[5], nums[7]];
    const x = Math.min(...xs),
      y = Math.min(...ys);
    const w = Math.max(...xs) - x,
      h = Math.max(...ys) - y;
    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("x", x);
    rect.setAttribute("y", y);
    rect.setAttribute("width", w);
    rect.setAttribute("height", h);
    rect.setAttribute("rx", "8");
    for (const a of ["fill", "stroke", "stroke-width", "class", "style"]) {
      if (firstPath.hasAttribute(a))
        rect.setAttribute(a, firstPath.getAttribute(a));
    }
    firstPath.replaceWith(rect);
  });

  document
    .querySelectorAll(
      "#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path",
    )
    .forEach((p) => {
      p.setAttribute("stroke", "none");
    });
</script>
